name: Ingest portraits
on:
  workflow_dispatch:
  push:
    paths:
      - "ops/portrait-b64/*.b64"
      - "ops/portrait-b64/READY"
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode portraits and commit
        run: |
          set -euo pipefail
          if [ ! -f ops/portrait-b64/READY ]; then echo "not ready"; exit 0; fi
          mkdir -p public/portraits
          for f in ops/portrait-b64/*.b64; do
            [ -f "$f" ] || continue
            slug=$(basename "$f" .b64)
            base64 -d "$f" > "public/portraits/${slug}.jpg"
            echo "wrote $slug.jpg ($(wc -c < public/portraits/${slug}.jpg) bytes)"
          done
          rm -rf ops/portrait-b64
          sed -i 's|/portraits/\([^"]*\)\.svg|/portraits/\1.jpg|g' content/authors/filipino.json content/authors/international.json content/archive.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat: decode JPEG portraits from base64 chunks"
          git push
